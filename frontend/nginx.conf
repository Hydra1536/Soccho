server {
    listen ${PORT};
    # Production-only host wiring. Localhost server_name intentionally removed.
    server_name soccho.onrender.com soccho.vercel.app;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
